id: /soml/rirpdm
label: Research Infrastructure and Research Publications Data Model (RIRPDM)
creator: Julian Paulussen
versionInfo: 0.1.0
prefixes:
  cito: http://purl.org/spar/cito/
  fabio: http://purl.org/spar/fabio/
  foaf: http://xmlns.com/foaf/0.1/
  frapo: http://purl.org/cerif/frapo/
  org: http://www.w3.org/ns/org#
  rirpdm: http://www.example.org/rirpdm#
specialPrefixes:
  vocab_prefix: rirpdm
  ontology_iri: http://www.example.org/rirpdm
  vocab_iri: http://www.example.org/rirpdm#
objects:
  AssociatedCountry:
    inherits:
      - Country
      - foaf:AgentInterface
    type: rirpdm:AssociatedCountry
    label: Associated Country
    descr: Country associated to the Framework Programme (FP)
  CentralHub:
    type: rirpdm:CentralHub
    label: Central Hub
    descr: The coordinating international organisation of a distributed RI that mediates between the nodes
  Country:
    kind: abstract
    type: rirpdm:Country
    label: Country
    descr: A nation eligible to participate in an RI
  DistributedRI:
    inherits: ResearchInfrastructureInterface
    type: rirpdm:DistributedRI
    label: Distributed RI
    descr: An RI made up of a Central Hub plus interlinked National Nodes; the Hub coordinates and manages each Node's RI-dedicated capacity under the RI Consortium's shared rules
    props:
      hasCentralHub:
        descr: Relates a distributed RI to its Central Hub, the truly international organisation that must guarantee effective operation, attribute optimal personnel capacity and coordinating power, and mediate across different scientific cultures. (ESFRI Roadmap 2026, p.15-16)
        kind: object
        label: hasCentralHub
        max: 1
        min: 1
        range: CentralHub
        rdfProp: rirpdm:hasCentralHub
      hasNode:
        descr: Relates a distributed RI to one of its interlinked National Nodes, whose capacity and resources devoted to the RI must be clearly identified, coordinated and managed by the Central Hub. (ESFRI Roadmap 2026, p.15)
        kind: object
        label: hasNode
        max: inf
        min: 1
        range: NationalNode
        rdfProp: rirpdm:hasNode
      jointInvestmentStrategy:
        descr: Joint investment strategy aimed to strengthen nodes and shared facilities
        kind: literal
        label: jointInvestmentStrategy
        max: inf
        range: string
        rdfProp: rirpdm:jointInvestmentStrategy
  ESFRILandmark:
    inherits: ResearchInfrastructureInterface
    type: rirpdm:ESFRILandmark
    label: ESFRI Landmark
    descr: An implemented (or near-implemented) RI established as a major asset of the European Research Area, periodically monitored
  ESFRIProject:
    inherits: ResearchInfrastructureInterface
    type: rirpdm:ESFRIProject
    label: ESFRI Project
    descr: A selected RI in its Preparation Phase, expected to reach Implementation within ten years
  Evaluation:
    type: rirpdm:Evaluation
    label: Evaluation
    descr: An assessment of a case dimension, producing a score at a given lifecycle phase
    props:
      assessedAtPhase:
        descr: The lifecycle phase at which an Evaluation was made
        kind: object
        label: assessedAtPhase
        range: LifecyclePhase
        rdfProp: rirpdm:assessedAtPhase
      evaluatesDimension:
        descr: The scientific or implementation dimension that an Evaluation assesses
        kind: object
        label: evaluatesDimension
        range: ImplementationDimension
        rdfProp: rirpdm:evaluatesDimension
      hasScore:
        descr: The score attributed by an Evaluation
        kind: object
        label: hasScore
        range: Score
        rdfProp: rirpdm:hasScore
  ImplementationCase:
    type: rirpdm:ImplementationCase
    label: Implementation Case
    descr: The five-dimension assessment of an RI's feasibility and delivery, attached to a Proposal or Research Infrastructure
    props:
      hasEvaluation:
        descr: Links a case to one of its per-dimension evaluations
        kind: object
        label: hasEvaluation
        max: 5
        range: Evaluation
        rdfProp: rirpdm:hasEvaluation
  ImplementationDimension:
    type: rirpdm:ImplementationDimension
    label: Implementation Dimension
    descr: One of the five dimensions along which an Implementation Case is assessed
  KPI:
    type: rirpdm:KPI
    label: KPI
    descr: One of the 21 key performance indicators, each belonging to exactly one KPIObjective
    props:
      forObjective:
        descr: The KPIObjective a KPI belongs to
        kind: object
        label: forObjective
        range: KPIObjective
        rdfProp: rirpdm:forObjective
      unitOfMeasure:
        descr: The unit in which a KPI's numericValue is expressed (e.g. Number, Percentage, Person hours)
        kind: literal
        label: unitOfMeasure
        range: string
        rdfProp: rirpdm:unitOfMeasure
  KPIMeasurement:
    type: rirpdm:KPIMeasurement
    label: KPI Measurement
    descr: One recorded value of a KPI for a research infrastructure in a given year
    props:
      derivedFromOutput:
        descr: The research outputs a KPI measurement aggregates over, making the recorded value auditable against the graph. ESFRI KPI 3 records a bare count
        kind: object
        label: derivedFromOutput
        max: inf
        range: ResearchOutputInterface
        rdfProp: rirpdm:derivedFromOutput
      measurementYear:
        descr: The year to which a KPI measurement applies; KPIs are monitored annually
        kind: literal
        label: measurementYear
        range: year
        rdfProp: rirpdm:measurementYear
      measuresKPI:
        descr: The KPI that a KPIMeasurement records a value for
        kind: object
        label: measuresKPI
        range: KPI
        rdfProp: rirpdm:measuresKPI
      numericValue:
        descr: The recorded value of a KPI measurement, expressed in the measured KPI's unitOfMeasure
        kind: literal
        label: numericValue
        range: decimal
        rdfProp: rirpdm:numericValue
  KPIObjective:
    type: rirpdm:KPIObjective
    label: KPI Objective
    descr: One of the nine commonly held objectives against which RIs monitor performance
  LifecyclePhase:
    type: rirpdm:LifecyclePhase
    label: Lifecycle Phase
    descr: Reference to understand the needs and targets of RIs at a given time and at various levels
  MajorUpgrade:
    inherits: ProposalInterface
    type: rirpdm:MajorUpgrade
    label: Major Upgrade
    descr: A transformative (not routine) upgrade to an operational RI
    props:
      upgradesRI:
        descr: The operational RI that a Major Upgrade proposal targets
        kind: object
        label: upgradesRI
        max: inf
        range: ResearchInfrastructureInterface
        rdfProp: rirpdm:upgradesRI
  MemberState:
    inherits:
      - Country
      - foaf:AgentInterface
    type: rirpdm:MemberState
    label: Member State
    descr: Member state of the European Union
  NationalNode:
    type: rirpdm:NationalNode
    label: National Node
    descr: A national/institutional component of a distributed RI whose RI-dedicated capacity and resources are identified, coordinated and managed by the Central Hub
    props:
      isNodeOf:
        descr: The distributed RI this national node belongs to
        kind: object
        label: isNodeOf
        max: inf
        range: DistributedRI
        rdfProp: rirpdm:isNodeOf
      isSupportedBy:
        descr: 'Connects an RI, national node or grant to its funding source at any level. Transitivity lets the reasoner infer the full chain: RI → Grant → FundingProgramme. The property chain hasNode o isSupportedBy additionally rolls a distributed RI''s node funding up to the RI, so the funders of the nodes are inferred funders of the RI itself'
        kind: object
        label: isSupportedBy
        max: inf
        range: frapo:FundingAgency
        rdfProp: rirpdm:isSupportedBy
  NewProposal:
    inherits: ProposalInterface
    type: rirpdm:NewProposal
    label: New Proposal
    descr: A candidate RI project submitted for selection onto the Roadmap
  Proposal:
    inherits: ProposalInterface
    type: rirpdm:Proposal
    label: Proposal
    descr: Abstract parent for candidate submissions to the Roadmap
  ProposalInterface:
    kind: abstract
    descr: Abstract superclass of Proposal
    props:
      hasImplementationCase:
        descr: Links a Proposal or Research Infrastructure to its Implementation Case assessment
        kind: object
        label: hasImplementationCase
        range: ImplementationCase
        rdfProp: rirpdm:hasImplementationCase
      hasScientificCase:
        descr: Links a Proposal or Research Infrastructure to its Scientific Case assessment
        kind: object
        label: hasScientificCase
        range: ScientificCase
        rdfProp: rirpdm:hasScientificCase
      resultsInProject:
        descr: The transition from a Proposal to the resulting selected RI; carries ex ante to ex post
        kind: object
        label: resultsInProject
        range: ResearchInfrastructureInterface
        rdfProp: rirpdm:resultsInProject
  RFO:
    inherits:
      - frapo:FundingAgency
      - org:OrganizationInterface
    type: rirpdm:RFO
    label: Research Funding Organisation (RFO)
    descr: Legal entity that can take binding decisions to financially support an RI
  RIConsortium:
    inherits: org:OrganizationInterface
    type: rirpdm:RIConsortium
    label: RI Consortium
    descr: The consortium of core partners governing a distributed RI, whose agreed statutes and common rules and procedures the Central Hub applies to coordinate and manage the National Nodes' RI-dedicated capacity. (ESFRI Roadmap 2026, p.15)
  RPO:
    inherits: org:OrganizationInterface
    type: rirpdm:RPO
    label: Research Performing Organisation (RPO)
    descr: Legal entity from a MS/AC/third country that performs research and can take binding decisions to support an RI
  ResearchData:
    inherits: ResearchDataInterface
    type: rirpdm:ResearchData
    label: Research Data
    descr: Data, including those underlying scientific publications, managed per FAIR principles
  ResearchDataInterface:
    inherits: ResearchOutputInterface
    kind: abstract
    descr: Abstract superclass of ResearchData
    props:
      compliesWithFAIR:
        descr: Whether the data adhere to the FAIR principles
        kind: literal
        label: compliesWithFAIR
        max: inf
        range: boolean
        rdfProp: rirpdm:compliesWithFAIR
      ensuresLongTermPreservation:
        descr: Whether long-term preservation of the data is ensured
        kind: literal
        label: ensuresLongTermPreservation
        max: inf
        range: boolean
        rdfProp: rirpdm:ensuresLongTermPreservation
  ResearchInfrastructure:
    inherits: ResearchInfrastructureInterface
    type: rirpdm:ResearchInfrastructure
    label: Research Infrastructure
    descr: A facility (or set of resources/services) enabling research and innovation
  ResearchInfrastructureInterface:
    kind: abstract
    descr: Abstract superclass of ResearchInfrastructure
    props:
      accessPoint:
        descr: The RI's entry point for external users to submit access proposals
        kind: literal
        label: accessPoint
        max: inf
        range: string
        rdfProp: rirpdm:accessPoint
      accessPolicy:
        descr: Policy governing external user access
        kind: literal
        label: accessPolicy
        max: inf
        range: string
        rdfProp: rirpdm:accessPolicy
      averageAnnualOperationCosts:
        descr: Annual cost of running the RI, operating access and delivering services
        kind: literal
        label: averageAnnualOperationCosts
        max: inf
        range: decimal
        rdfProp: rirpdm:averageAnnualOperationCosts
      dataManagementSystem:
        descr: The RI's system for metadata, storage, retrieval and data reduction/analysis
        kind: literal
        label: dataManagementSystem
        max: inf
        range: string
        rdfProp: rirpdm:dataManagementSystem
      designCosts:
        descr: Costs of conceptual design, technical design, feasibility study and proposal drafting
        kind: literal
        label: designCosts
        max: inf
        range: decimal
        rdfProp: rirpdm:designCosts
      governanceStructure:
        descr: The RI's governance structure with defined responsibilities, reporting lines and advisory/supervisory bodies
        kind: literal
        label: governanceStructure
        max: inf
        range: string
        rdfProp: rirpdm:governanceStructure
      hasImplementationCase:
        descr: Links a Proposal or Research Infrastructure to its Implementation Case assessment
        kind: object
        label: hasImplementationCase
        range: ImplementationCase
        rdfProp: rirpdm:hasImplementationCase
      hasKPIMeasurement:
        descr: Relates a research infrastructure to one of its recorded KPI measurements
        kind: object
        label: hasKPIMeasurement
        max: inf
        range: KPIMeasurement
        rdfProp: rirpdm:hasKPIMeasurement
      hasLeadEntity:
        descr: The agent leading the research infrastructure
        kind: object
        label: hasLeadEntity
        range: foaf:AgentInterface
        rdfProp: rirpdm:hasLeadEntity
      hasMemberEntity:
        descr: An agent that is a member of the research infrastructure
        kind: object
        label: hasMemberEntity
        max: inf
        range: foaf:AgentInterface
        rdfProp: rirpdm:hasMemberEntity
      hasObserver:
        descr: An agent observing the research infrastructure
        kind: object
        label: hasObserver
        max: inf
        range: foaf:AgentInterface
        rdfProp: rirpdm:hasObserver
      hasParticipant:
        descr: An agent participating in the research infrastructure
        kind: object
        label: hasParticipant
        max: inf
        range: foaf:AgentInterface
        rdfProp: rirpdm:hasParticipant
      hasProspectiveMember:
        descr: An agent that is a prospective member of the research infrastructure
        kind: object
        label: hasProspectiveMember
        max: inf
        range: foaf:AgentInterface
        rdfProp: rirpdm:hasProspectiveMember
      hasScientificCase:
        descr: Links a Proposal or Research Infrastructure to its Scientific Case assessment
        kind: object
        label: hasScientificCase
        range: ScientificCase
        rdfProp: rirpdm:hasScientificCase
      humanResourcesPolicy:
        descr: HR policy ensuring competences via equal-opportunity hiring, secondments, education and training
        kind: literal
        label: humanResourcesPolicy
        max: inf
        range: string
        rdfProp: rirpdm:humanResourcesPolicy
      implementationCosts:
        descr: Real or estimated costs for the Implementation Phase of an RI
        kind: literal
        label: implementationCosts
        max: inf
        range: decimal
        rdfProp: rirpdm:implementationCosts
      indirectlyExposedTo:
        descr: 'An RI is indirectly exposed to a funding source through a collaborating partner RI''s funding chain. Inferred via property chain: involvesAgent o collaboratesWith o participatesIn o isSupportedBy'
        kind: object
        label: indirectlyExposedTo
        max: inf
        range: frapo:FundingAgency
        rdfProp: rirpdm:indirectlyExposedTo
      involvesAgent:
        descr: An agent is involved in this research infrastructure
        kind: object
        label: involvesAgent
        max: inf
        range: foaf:AgentInterface
        rdfProp: rirpdm:involvesAgent
      isInPhase:
        descr: The current lifecycle phase of the research infrastructure
        kind: object
        label: isInPhase
        range: LifecyclePhase
        rdfProp: rirpdm:isInPhase
      isSupportedBy:
        descr: 'Connects an RI, national node or grant to its funding source at any level. Transitivity lets the reasoner infer the full chain: RI → Grant → FundingProgramme. The property chain hasNode o isSupportedBy additionally rolls a distributed RI''s node funding up to the RI, so the funders of the nodes are inferred funders of the RI itself'
        kind: object
        label: isSupportedBy
        max: inf
        range: frapo:FundingAgency
        rdfProp: rirpdm:isSupportedBy
      legalStatus:
        descr: The legal status of the RI
        kind: literal
        label: legalStatus
        max: inf
        range: string
        rdfProp: rirpdm:legalStatus
      preparationCosts:
        descr: Real/estimated costs of the Preparation Phase
        kind: literal
        label: preparationCosts
        max: inf
        range: decimal
        rdfProp: rirpdm:preparationCosts
      producesResearchOutput:
        descr: A research output produced by the research infrastructure
        kind: object
        label: producesResearchOutput
        max: inf
        range: ResearchOutputInterface
        rdfProp: rirpdm:producesResearchOutput
      serviceOffer:
        descr: Service offer to the user community
        kind: literal
        label: serviceOffer
        max: inf
        range: string
        rdfProp: rirpdm:serviceOffer
      terminationCosts:
        descr: Decommissioning and environmental-mitigation costs at end of a lifecycle of an RI
        kind: literal
        label: terminationCosts
        max: inf
        range: decimal
        rdfProp: rirpdm:terminationCosts
      totalInvestmentCosts:
        descr: Sum of all lifecycle investments to fully implement a RI
        kind: literal
        label: totalInvestmentCosts
        max: inf
        range: decimal
        rdfProp: rirpdm:totalInvestmentCosts
      uniqueName:
        descr: The RI's unique specific name
        kind: literal
        label: uniqueName
        max: inf
        range: string
        rdfProp: rirpdm:uniqueName
      userProgramme:
        descr: A user programme using a relevant fraction of the RI's total capacity
        kind: literal
        label: userProgramme
        max: inf
        range: string
        rdfProp: rirpdm:userProgramme
  ResearchInstitution:
    inherits: org:OrganizationInterface
    type: rirpdm:ResearchInstitution
    label: Research Institution
    descr: Organization that participates as a partner in an RI Consortium
    props:
      collaboratesWith:
        descr: Two research institutions collaborate. Symmetry means asserting A→B is enough; B→A is inferred
        kind: object
        label: collaboratesWith
        max: inf
        range: ResearchInstitution
        rdfProp: rirpdm:collaboratesWith
        symmetric: true
  ResearchOutput:
    inherits: ResearchOutputInterface
    type: rirpdm:ResearchOutput
    label: Research Output
    descr: Results of an action accessible as scientific publications, data, software, algorithms, protocols, etc
  ResearchOutputInterface:
    kind: abstract
    descr: Abstract superclass of ResearchOutput
    props:
      fabio:hasDOI:
        descr: Digital Object Identifier of the research output
        kind: literal
        label: has DOI
        range: string
        rdfProp: fabio:hasDOI
      isOutputOf:
        descr: The research infrastructure that produced this output
        kind: object
        label: isOutputOf
        max: inf
        range: ResearchInfrastructureInterface
        rdfProp: rirpdm:isOutputOf
      providesOpenAccess:
        descr: Whether open access is ensured for the output (publications and underlying data)
        kind: literal
        label: providesOpenAccess
        max: inf
        range: boolean
        rdfProp: rirpdm:providesOpenAccess
  Researcher:
    inherits:
      - foaf:AgentInterface
      - foaf:Person
    type: rirpdm:Researcher
    label: Researcher
    descr: An agent who conducts scientific research, typically as a participant in a research infrastructure
    props:
      authorOf:
        descr: Relates a researcher to a scientific publication they authored
        kind: object
        label: authorOf
        max: inf
        range: ScientificPublicationInterface
        rdfProp: rirpdm:authorOf
      contributesToRI:
        descr: 'A researcher contributed to a research infrastructure via a publication they authored that is an output of that RI. Inferred via property chain: authorOf o isOutputOf'
        kind: object
        label: contributesToRI
        max: inf
        range: ResearchInfrastructureInterface
        rdfProp: rirpdm:contributesToRI
  ScientificCase:
    type: rirpdm:ScientificCase
    label: Scientific Case
    descr: The six-dimension assessment of an RI's scientific merit, attached to a Proposal or Research Infrastructure
    props:
      hasEvaluation:
        descr: Links a case to one of its per-dimension evaluations
        kind: object
        label: hasEvaluation
        max: 6
        range: Evaluation
        rdfProp: rirpdm:hasEvaluation
  ScientificDimension:
    type: rirpdm:ScientificDimension
    label: Scientific Dimension
    descr: One of the six dimensions along which a Scientific Case is assessed
  ScientificPublication:
    inherits: ScientificPublicationInterface
    type: rirpdm:ScientificPublication
    label: Scientific Publication
    descr: A peer-reviewed publication output to which open access applies
  ScientificPublicationInterface:
    inherits:
      - ResearchOutputInterface
      - fabio:ExpressionInterface
    kind: abstract
    descr: Abstract superclass of ScientificPublication
    props:
      cito:cites:
        descr: The citing entity cites the cited entity
        kind: object
        label: cites
        max: inf
        range: ResearchOutputInterface
        rdfProp: cito:cites
      fabio:hasPublicationVenue:
        descr: Relates a publication to the journal or proceedings it appeared in
        kind: object
        label: has publication venue
        max: inf
        range: fabio:Journal
        rdfProp: fabio:hasPublicationVenue
      hasAuthor:
        descr: Relates a scientific publication to a researcher who authored it
        kind: object
        label: hasAuthor
        max: inf
        range: Researcher
        rdfProp: rirpdm:hasAuthor
  Score:
    type: rirpdm:Score
    label: Score
    descr: Grading attributed to a dimension
  SingleSitedRI:
    inherits: ResearchInfrastructureInterface
    type: rirpdm:SingleSitedRI
    label: Single-sited RI
    descr: An RI concentrated geographically at one site (or a few complementary sites) designed for user access. (ESFRI Roadmap 2026, p.15)
    props:
      longTermSitePlanning:
        descr: Long-term plan for the site across its lifecycle
        kind: literal
        label: longTermSitePlanning
        max: inf
        range: string
        rdfProp: rirpdm:longTermSitePlanning
      userSupportStructure:
        descr: A single-sited RI's structure (office, ancillary laboratories, accommodation, logistics, etc.) to support user access
        kind: literal
        label: userSupportStructure
        max: inf
        range: string
        rdfProp: rirpdm:userSupportStructure
  ThirdCountry:
    inherits:
      - Country
      - foaf:AgentInterface
    type: rirpdm:ThirdCountry
    label: Third Country
    descr: Country outside Member State / Associated Country
  VirtualRI:
    inherits: ResearchInfrastructureInterface
    type: rirpdm:VirtualRI
    label: Virtual RI
    descr: 'An RI with no fixed physical site: its resources and services are accessed remotely rather than in person'
  fabio:AcademicProceedings:
    type: fabio:AcademicProceedings
    label: Conference Proceedings
    descr: The published collection of papers from a conference
  fabio:ConferencePaper:
    inherits: ScientificPublicationInterface
    type: fabio:ConferencePaper
    label: Conference Paper
    descr: A paper presented at a conference and published in its proceedings
  fabio:Dataset:
    inherits: ResearchDataInterface
    type: fabio:Dataset
    label: Dataset
    descr: A published, citable collection of research data
  fabio:Expression:
    inherits: fabio:ExpressionInterface
    type: fabio:Expression
    label: Expression
    descr: A FaBiO/FRBR expression — the intellectual realisation of a work, the bibliographic superclass of all publication types
  fabio:ExpressionInterface:
    kind: abstract
    descr: Abstract superclass of fabio:Expression
  fabio:Journal:
    type: fabio:Journal
    label: Journal
    descr: A periodical publishing scholarly articles
  fabio:JournalArticle:
    inherits: ScientificPublicationInterface
    type: fabio:JournalArticle
    label: Journal Article
    descr: A research article published in a journal issue
  fabio:ReportDocument:
    inherits: ScientificPublicationInterface
    type: fabio:ReportDocument
    label: Report
    descr: A technical or research report
  fabio:Thesis:
    inherits: ScientificPublicationInterface
    type: fabio:Thesis
    label: Thesis
    descr: A document submitted in support of an academic degree
  foaf:Agent:
    inherits: foaf:AgentInterface
    type: foaf:Agent
    label: Agent
  foaf:AgentInterface:
    kind: abstract
    descr: Abstract superclass of foaf:Agent
    props:
      participatesIn:
        descr: An agent participates in a research infrastructure
        kind: object
        label: participatesIn
        max: inf
        range: ResearchInfrastructureInterface
        rdfProp: rirpdm:participatesIn
  foaf:Person:
    kind: abstract
    type: foaf:Person
    label: Person
  frapo:Budget:
    type: frapo:Budget
    label: Budget
    descr: A planned allocation of financial resources for a project or infrastructure
  frapo:Expenditure:
    type: frapo:Expenditure
    label: Expenditure
    descr: Money actually spent against a budget
  frapo:Funding:
    kind: abstract
    type: frapo:Funding
    label: Funding
    descr: Financial support provided to undertake research or operate an infrastructure
  frapo:FundingAgency:
    kind: abstract
    type: frapo:FundingAgency
    label: Funding Agency
    descr: An organisation that provides funding for research projects or infrastructures
  frapo:FundingProgramme:
    type: frapo:FundingProgramme
    label: Funding Programme
    descr: A structured scheme under which a funding agency awards grants
  frapo:Grant:
    inherits: frapo:Funding
    type: frapo:Grant
    label: Grant
    descr: A sum of money awarded by a funding agency to support a specific project or activity
    props:
      isSupportedBy:
        descr: 'Connects an RI, national node or grant to its funding source at any level. Transitivity lets the reasoner infer the full chain: RI → Grant → FundingProgramme. The property chain hasNode o isSupportedBy additionally rolls a distributed RI''s node funding up to the RI, so the funders of the nodes are inferred funders of the RI itself'
        kind: object
        label: isSupportedBy
        max: inf
        range: frapo:FundingAgency
        rdfProp: rirpdm:isSupportedBy
  frapo:Project:
    type: frapo:Project
    label: Project
    descr: An activity undertaken to achieve defined objectives, optionally funded by one or more sources
  org:Organization:
    inherits: org:OrganizationInterface
    type: org:Organization
    label: Organization
  org:OrganizationInterface:
    inherits: foaf:AgentInterface
    kind: abstract
    descr: Abstract superclass of org:Organization
