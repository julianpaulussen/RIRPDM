name: Build and deploy ontology docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Download Widoco
        run: wget -O widoco.jar https://github.com/dgarijo/Widoco/releases/download/v1.4.25/widoco-1.4.25-jar-with-dependencies_JDK-17.jar

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate documentation
        run: |
          mkdir public
          java -jar widoco.jar -ontFile ontology/rirpdm.ttl -outFolder public \
            -uniteSections -includeAnnotationProperties -getOntologyMetadata \
            -noPlaceHolderText -rewriteAll -webVowl -displayDirectImportsOnly
          cp public/index-en.html public/index.html
          cp public/ontology.owl public/rirpdm.owl

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
